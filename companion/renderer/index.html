<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cursor Mobile Companion</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --card: #161618;
        --text: #f4f4f5;
        --muted: #8e8e93;
        --accent: #3b82f6;
      }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        height: 100%;
      }
      main { padding: 28px 24px 40px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p { color: var(--muted); line-height: 1.45; }
      .code {
        font-size: 42px;
        letter-spacing: 10px;
        font-weight: 700;
        margin: 18px 0;
      }
      img { width: 200px; height: 200px; background: white; border-radius: 16px; padding: 10px; }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        margin-right: 8px;
        margin-top: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: #2c2c2e; }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 18px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cursor Mobile Companion</h1>
      <p>Sign in with your Cursor account, then enter this pairing code on your iPhone. Local chats stay on this computer.</p>
      <div class="card">
        <div id="auth">Checking login…</div>
        <div class="code" id="code">------</div>
        <img id="qr" alt="Pairing QR" />
        <p id="port"></p>
        <button id="login">Sign in with Cursor</button>
        <button id="rotate" class="secondary">New code</button>
        <button id="logout" class="secondary">Sign out</button>
      </div>
    </main>
    <script>
      const api = window.companion;
      async function refresh() {
        const s = await api.state();
        document.getElementById("code").textContent = s.pairingCode;
        document.getElementById("qr").src = s.qr;
        document.getElementById("port").textContent = "Listening on port " + s.port + " · Bonjour _cursormobile._tcp";
        const email = s.me?.email || s.auth?.email;
        document.getElementById("auth").textContent = email
          ? "Signed in as " + email
          : "Not signed in";
      }
      document.getElementById("login").onclick = async () => {
        await api.login();
        refresh();
      };
      document.getElementById("logout").onclick = async () => {
        await api.logout();
        refresh();
      };
      document.getElementById("rotate").onclick = async () => {
        await api.rotateCode();
        refresh();
      };
      refresh();
      setInterval(refresh, 4000);
    </script>
  </body>
</html>
