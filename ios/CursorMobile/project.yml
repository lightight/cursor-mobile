name: CursorMobile
options:
  bundleIdPrefix: com.cursormobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: "YES"
targets:
  CursorMobile:
    type: application
    platform: iOS
    sources:
      - path: CursorMobile
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursormobile.app
        PRODUCT_NAME: Cursor Mobile
        INFOPLIST_FILE: CursorMobile/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        SUPPORTS_LIVE_ACTIVITIES: "YES"
    dependencies:
      - target: CursorMobileLiveActivity
        embed: true
        codeSign: false
    scheme: {}
  CursorMobileLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: CursorMobileLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursormobile.app.LiveActivity
        PRODUCT_NAME: CursorMobileLiveActivity
        INFOPLIST_FILE: CursorMobileLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        SKIP_INSTALL: "YES"
